{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Log Explorer</h3>
  <div class="d-flex gap-2">
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" role="switch" id="toggle-anomalies">
      <label class="form-check-label" for="toggle-anomalies">Only anomalies</label>
    </div>
    {% if session.get('user') and session['user']['role'] == 'admin' %}
    <label class="btn btn-sm btn-outline-primary mb-0" for="file-upload">Upload CSV</label>
    <input type="file" id="file-upload" accept=".csv" hidden>
    {% endif %}
  </div>
</div>
<div class="table-responsive">
  <table class="table table-striped" id="logs-table">
    <thead>
      <tr>
        <th>Timestamp</th>
        <th>Source</th>
        <th>Host</th>
        <th>IP</th>
        <th>Event</th>
        <th>Status</th>
        <th>Bytes</th>
        <th>Message</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
{% endblock %}
{% block scripts %}
<script>
  window.addEventListener('DOMContentLoaded', () => {
    window.SIEM.initLogs();
  });
</script>
{% endblock %}
